services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: expense_app
        # restart: always
        ports:
            - '${APP_PORT:-8000}:8000'
        volumes:
            - ./:/app
            - /app/.venv
            - logs_data:/app/logs
        environment:
            - APP_NAME=${APP_NAME}
            - APP_VERSION=${APP_VERSION}
            - APP_PORT=${APP_PORT}
            - BASE_URL=${BASE_URL}
            - FRONTEND_URL=${FRONTEND_URL}
            - VERSION=${VERSION}
            - DEBUG=${DEBUG}
            - SECRET_KEY=${SECRET_KEY}
            - ALGORITHM=${ALGORITHM}
            - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
            - DB_HOST=db
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOST=redis
            - REDIS_PORT=${REDIS_PORT}
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_DB=${REDIS_DB}
            - MAIL_MAILER=${MAIL_MAILER}
            - MAIL_HOST=${MAIL_HOST}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_ENCRYPTION=${MAIL_ENCRYPTION}
            - MAIL_FROM=${MAIL_FROM}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - expense-network

    migrate:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: expense_migrate
        environment:
            - DB_HOST=db
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
        depends_on:
            db:
                condition: service_healthy
        command: /app/.venv/bin/alembic upgrade head   # ← direct path, no uv needed
        profiles:
            - migrate
        networks:
            - expense-network

    db:
        image: mysql/mysql-server:latest
        container_name: expense_db
        restart: always
        ports:
            - '${DB_PORT:-3306}:3306'
        mem_limit: 1g
        cpus: 2
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -u root -p${DB_PASSWORD}']
            retries: 3
            timeout: 5s
            start_period: 30s
        networks:
            - expense-network

    redis:
        image: redis:latest
        container_name: expense_redis
        restart: always
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - expense-network

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        container_name: expense_phpmyadmin
        restart: always
        ports:
            - '8080:80'
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=db
            - PMA_PORT=${DB_PORT:-3306}
            - PMA_USER=${DB_USERNAME}
            - PMA_PASSWORD=${DB_PASSWORD}
            - UPLOAD_LIMIT=256M
            - MEMORY_LIMIT=512M
            - MAX_EXECUTION_TIME=600
        healthcheck:
            test: ['CMD-SHELL', 'curl -fs http://localhost/ | grep -q phpMyAdmin']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        depends_on:
            db:
                condition: service_healthy
        networks:
            - expense-network

    redisinsight:
        image: redislabs/redisinsight:latest
        container_name: expense_redisinsight
        restart: always
        ports:
            - '5540:5540'
        depends_on:
            - redis
        environment:
            - REDISINSIGHT_REDIS_HOST=${REDIS_HOST}
            - REDISINSIGHT_REDIS_PORT=${REDIS_PORT}
            - REDISINSIGHT_REDIS_USERNAME=${REDIS_USERNAME}
            - REDISINSIGHT_REDIS_PASSWORD=${REDIS_PASSWORD}
        volumes:
            - redisinsight-data:/data
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5540/api/health/ | grep -q up']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s
        networks:
            - expense-network

volumes:
    mysql-data:
    redis-data:
    redisinsight-data:
    logs_data:

networks:
    expense-network:
        driver: bridge